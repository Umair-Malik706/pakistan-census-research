version: 2

models:
  - name: dim_geography

    description: >
      Reusable geography dimension derived from PBS Census 2023 Table 4.
      Contains one row per geographic entity represented in the source data.
      Geography keys include province and parent-district context where needed
      so that names remain unambiguous as additional provinces are added.
    
    semantic_model:
      enabled: true

    columns:
      - name: geography_key
        entity:
          type: primary
          name: geography
        data_tests:
          - not_null
          - unique

      - name: geography_level
        dimension:
          type: categorical
        description: >
          Administrative or source geography type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - district
                  - tehsil
                  - taluka
                  - protected_area
                  - sub_division
                  - sub_tehsil
                  - de_excluded_area

      - name: geography_name
        dimension:
          type: categorical
        description: >
          Clean analytical geography name derived from the PBS source.
        data_tests:
          - not_null

      - name: province_name
        dimension:
          type: categorical
        data_tests:
          - not_null

      - name: district_key
        description: >
          Stable identifier for the parent district. For district rows this
          equals geography_key.
        data_tests:
          - not_null

      - name: district_name
        dimension:
          type: categorical
        description: >
          Clean analytical name of the parent district.
        data_tests:
          - not_null
  
  - name: dim_age
    description: >
      Analytical age dimension derived from the validated Census 2023
      Table 4 age structure. Contains one row for each mutually exclusive
      age bucket used by analytical population facts.
    semantic_model:
      enabled: true

    columns:
      - name: age_key
        description: Stable analytical key for the age bucket.
        entity:
          type: primary
          name: age
        data_tests:
          - not_null
          - unique

      - name: age_label
        description: Original PBS age label.
        dimension:
          type: categorical

      - name: age_type
        description: Type of analytical age bucket.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - single_age
                  - open_ended_age_group

      - name: age_year
        description: Exact age in completed years where applicable.

      - name: age_lower
        description: Lower bound of the age bucket.
        data_tests:
          - not_null

      - name: age_upper
        description: >
          Upper bound of the age bucket. Null for the open-ended
          75 years and above category.

      - name: age_sort
        description: Numeric value used to order age buckets correctly.
        data_tests:
          - not_null
          - unique

      - name: age_group_5yr
        description: Derived five-year analytical age group.
        dimension:
          type: categorical

      - name: age_group_broad
        description: >
          Broad analytical age group: 0-14, 15-64, or 65+.
        dimension:
          type: categorical

  - name: fct_population_by_age_sex_residence

    description: >
      Research-ready Census 2023 population fact table containing mutually
      exclusive age categories by geography, residence, and sex. Five-year
      summary age groups and ALL AGES rows are excluded to prevent
      double-counting. Source provenance is retained.

    columns:
      - name: census_year
        description: Census reference year.
        data_tests:
          - not_null

      - name: geography_key
        description: >
          Stable identifier linking the observation to dim_geography.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: district_key
        description: Stable identifier for the parent district.
        data_tests:
          - not_null

      - name: province_name
        description: Province or territory containing the geography.
        data_tests:
          - not_null

      - name: age_label_raw
        description: Original PBS age label retained for provenance.
        data_tests:
          - not_null

      - name: age_type
        description: >
          Age classification. This mart contains only single-year ages and
          the open-ended 75-and-above category.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - single_age
                  - open_ended_age_group

      - name: age_year
        description: >
          Exact age for single-year observations. Null for 75 & ABOVE.

      - name: age_lower
        description: Lower bound of the represented age category.
        data_tests:
          - not_null

      - name: age_upper
        description: >
          Upper age bound. Null only for the open-ended 75 & ABOVE category.

      - name: residence
        description: Residence category.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - all_localities
                  - rural
                  - urban

      - name: sex
        description: Sex category.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - all_sexes
                  - male
                  - female
                  - transgender

      - name: population
        description: Population count for the represented combination.
        data_tests:
          - not_null

      - name: source_id
        description: Source-manifest identifier.
        data_tests:
          - not_null

      - name: source_file
        description: Original PBS workbook filename.
        data_tests:
          - not_null

      - name: source_sheet
        description: Original worksheet name.
        data_tests:
          - not_null

      - name: source_row_number
        description: Original Excel row number.
        data_tests:
          - not_null
  
  - name: fct_population
    description: >
      Additive analytical population fact derived from the validated Census 2023
      Table 4 research fact. Contains only mutually exclusive age, residence,
      and sex categories so demographic aggregation is safe within a compatible
      geography level.

    columns:
      - name: census_year
        description: Census year represented by the observation.
        data_tests:
          - not_null

      - name: geography_key
        description: Foreign key to dim_geography.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: age_key
        description: Foreign key to dim_age.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_age')
                field: age_key

      - name: residence
        description: Mutually exclusive residence category.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - rural
                  - urban

      - name: sex
        description: Mutually exclusive sex category.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - male
                  - female
                  - transgender

      - name: population
        description: Population count for the fact grain.
        data_tests:
          - not_null

      - name: source_id
        description: Source identifier from the PBS source manifest.

      - name: source_file
        description: Original PBS workbook filename.

      - name: source_sheet
        description: Original PBS worksheet name.

      - name: source_row_number
        description: Original source row number.
  
  - name: fct_population_district
    description: >
      District-safe analytical population fact containing only district and
      district-equivalent geographies. Designed for additive district,
      provincial, and national population analysis without geographic
      double-counting.
    
    semantic_model:
      enabled: true

    primary_entity: population_observation

    agg_time_dimension: census_date


    columns:
      - name: census_year
        dimension:
          type: categorical
        data_tests:
          - not_null
      
      - name: census_date
        granularity: year
        dimension:
          type: time

      - name: geography_key
        entity:
          type: foreign
          name: geography
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: age_key
        entity:
          type: foreign
          name: age
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_age')
                field: age_key

      - name: residence
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rural, urban]

      - name: sex
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [male, female, transgender]

      - name: population
        data_tests:
          - not_null
    
    metrics:
      - name: total_population
        description: >
          Total population represented by the approved district-safe
          analytical population fact.
        type: simple
        label: Total Population
        agg: sum
        expr: population
     
      - name: rural_population
        description: Total population living in rural areas.
        label: Rural Population
        type: derived
        expr: rural_total
        input_metrics:
          - name: total_population
            alias: rural_total
            filter: |
              {{ Dimension('population_observation__residence') }} = 'rural'

      - name: urban_population
        description: Total population living in urban areas.
        label: Urban Population
        type: derived
        expr: urban_total
        input_metrics:
          - name: total_population
            alias: urban_total
            filter: |
              {{ Dimension('population_observation__residence') }} = 'urban'
      
      - name: rural_share
        description: Share of the total population living in rural areas.
        label: Rural Share
        type: ratio
        numerator: rural_population
        denominator: total_population

      - name: urban_share
        description: Share of the total population living in urban areas.
        label: Urban Share
        type: ratio
        numerator: urban_population
        denominator: total_population
      
      - name: male_population
        description: Total male population.
        label: Male Population
        type: derived
        expr: male_total
        input_metrics:
          - name: total_population
            alias: male_total
            filter: |
              {{ Dimension('population_observation__sex') }} = 'male'

      - name: female_population
        description: Total female population.
        label: Female Population
        type: derived
        expr: female_total
        input_metrics:
          - name: total_population
            alias: female_total
            filter: |
              {{ Dimension('population_observation__sex') }} = 'female'
      
      - name: transgender_population
        description: Total transgender population.
        label: Transgender Population
        type: derived
        expr: transgender_total
        input_metrics:
          - name: total_population
            alias: transgender_total
            filter: |
              {{ Dimension('population_observation__sex') }} = 'transgender'
      
      - name: sex_ratio_male_per_100_female
        description: Number of males per 100 females.
        label: Sex Ratio (Males per 100 Females)
        type: derived
        expr: (male_total / female_total) * 100
        input_metrics:
          - name: male_population
            alias: male_total
          - name: female_population
            alias: female_total
        
        name: population_age_65_plus
        description: Total population aged 65 years and above.
        label: Population Age 65+
        type: derived
        expr: population_65_plus
        input_metrics:
          - name: total_population
            alias: population_65_plus
            filter: |
              {{ Dimension('age__age_group_broad') }} = '65+'
      - name: population_age_0_14
        description: Total population aged 0 to 14 years.
        label: Population Age 0-14
        type: derived
        expr: population_0_14
        input_metrics:
          - name: total_population
            alias: population_0_14
            filter: |
              {{ Dimension('age__age_group_broad') }} = '0-14'

      - name: population_age_15_64
        description: Total population aged 15 to 64 years.
        label: Population Age 15-64
        type: derived
        expr: population_15_64
        input_metrics:
          - name: total_population
            alias: population_15_64
            filter: |
              {{ Dimension('age__age_group_broad') }} = '15-64'

      - name: share_age_0_14
        description: Share of the population aged 0 to 14 years.
        label: Share Age 0-14
        type: ratio
        numerator: population_age_0_14
        denominator: total_population

      - name: share_age_15_64
        description: Share of the population aged 15 to 64 years.
        label: Share Age 15-64
        type: ratio
        numerator: population_age_15_64
        denominator: total_population

      - name: share_age_65_plus
        description: Share of the population aged 65 years and above.
        label: Share Age 65+
        type: ratio
        numerator: population_age_65_plus
        denominator: total_population
  
  - name: time_spine_daily
    description: >
      Daily time spine used by MetricFlow for time-based metric queries.

    time_spine:
      standard_granularity_column: date_day

    columns:
      - name: date_day
        granularity: day
        data_tests:
          - not_null
          - unique
