version: 2

models:
  - name: int_pbs__census_2023_table_04_long

    description: >
      Long-format intermediate model for PBS Census 2023 Table 4.
      Each staging observation is expanded from twelve population columns
      into residence, sex, and population rows. The original source and
      age provenance fields are retained.

    columns:
      - name: source_id
        description: >
          Identifier linking the observation to the project source manifest.
        data_tests:
          - not_null

      - name: source_row_number
        description: >
          Original Excel row number from the PBS workbook.
        data_tests:
          - not_null

      - name: geography_name_raw
        description: >
          Geography heading preserved from the PBS source.
        data_tests:
          - not_null

      - name: geography_level
        description: >
          Structural geography type inherited from staging.
        data_tests:
          - not_null

      - name: district_name_raw
        description: >
          Parent district heading preserved from the PBS source.
        data_tests:
          - not_null

      - name: age_label_raw
        description: >
          Original PBS age or summary label.
        data_tests:
          - not_null

      - name: age_type
        description: >
          Analytical classification of the PBS age label.
        data_tests:
          - not_null

      - name: residence
        description: >
          Residence category represented by the population value.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - all_localities
                  - rural
                  - urban

      - name: sex
        description: >
          Sex category represented by the population value.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - all_sexes
                  - male
                  - female
                  - transgender

      - name: population
        description: >
          Population count for the geography, age, residence, and sex
          combination. Stored as BIGINT.
        data_tests:
          - not_null
      
  - name: int_pbs__census_2023_table_04_geography
    
    description: >
      Intermediate Census 2023 Table 4 model with analytical geography names.
      Original PBS geography fields are retained for provenance. DISTRICT and
      TEHSIL suffixes are removed from the analytical geography fields, while
      special geography labels are preserved.

    columns:
      - name: geography_name_raw
        description: >
          Original geography heading exactly as preserved from the PBS source.
        data_tests:
          - not_null

      - name: geography_name
        description: >
          Analytical geography name. DISTRICT and TEHSIL suffixes are removed
          where applicable, while special geography labels are preserved.
        data_tests:
          - not_null

      - name: geography_level
        description: >
          Geography type inherited from the ingestion and staging layers.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - district
                  - tehsil
                  - protected_area
                  - sub_division
                  - de_excluded_area

      - name: district_name_raw
        description: >
          Original parent district heading as published by PBS.
        data_tests:
          - not_null

      - name: district_name
        description: >
          Analytical parent district name with the DISTRICT suffix removed.
        data_tests:
          - not_null

      - name: residence
        description: >
          Residence category inherited from the long-format model.
        data_tests:
          - not_null

      - name: sex
        description: >
          Sex category inherited from the long-format model.
        data_tests:
          - not_null

      - name: population
        description: >
          Population count for the geography, age, residence, and sex
          combination.
        data_tests:
          - not_null
      
      - name: district_key
        description: >
          Stable analytical key for the parent district and the province, constructed as
          district:<district_name>.
        data_tests:
          - not_null

      - name: geography_key
        description: >
          Stable analytical key identifying the geography represented by the
          row. District keys use district:<district_name>. Tehsil keys include
          both parent district and tehsil name. Special-area keys include the
          parent district and special geography name.
        data_tests:
          - not_null
      - name: province_name
        description: >
          Province or territory containing the geography. Currently Punjab
          because only the Punjab Table 4 source has been ingested.
        data_tests:
          - not_null