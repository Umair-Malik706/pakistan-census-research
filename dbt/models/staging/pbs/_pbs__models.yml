version: 2

models:
  - name: stg_pbs__census_2023_table_04

    description: >
      Staging model for Pakistan Bureau of Statistics Population and Housing
      Census 2023 Table 4: Population by single year age, sex and rural/urban.
      This model remains intentionally close to the raw source. Source labels
      and population values are preserved without research-level
      interpretation.

    columns:
      - name: source_id
        description: >
          Identifier linking each record to the project source manifest.
        data_tests:
          - not_null

      - name: source_file
        description: >
          Original PBS workbook filename from which the record was ingested.
        data_tests:
          - not_null

      - name: source_sheet
        description: >
          Original Excel worksheet name.
        data_tests:
          - not_null

      - name: source_row_number
        description: >
          Original Excel row number used for observation-level provenance.
        data_tests:
          - not_null

      - name: geography_name_raw
        description: >
          Geography heading preserved from the PBS workbook without
          standardization.
        data_tests:
          - not_null

      - name: geography_level
        description: >
          Structural geography type assigned during ingestion.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - district
                  - tehsil
                  - de_excluded_area

      - name: district_name_raw
        description: >
          Parent district heading preserved from the PBS workbook.
        data_tests:
          - not_null

      - name: age_label_raw
        description: >
          Original PBS age or summary label, such as ALL AGES, 00 -- 04,
          BELOW 1, 01, or 75 & ABOVE.
        data_tests:
          - not_null

      - name: all_all_sexes
        description: >
          Population across all localities and all sexes. Numeric PBS values
          are cast to BIGINT. The source symbol "-" is interpreted as zero
          following arithmetic validation against published totals.

      - name: all_male
        description: >
          Male population across all localities. Stored as BIGINT, with the
          source symbol "-" interpreted as zero.

      - name: all_female
        description: >
          Female population across all localities. Stored as BIGINT, with the
          source symbol "-" interpreted as zero.

      - name: all_transgender
        description: >
          Transgender population across all localities. Stored as BIGINT, with
          the source symbol "-" interpreted as zero.

      - name: rural_all_sexes
        description: >
          Rural population for all sexes. Stored as BIGINT, with the source
          symbol "-" interpreted as zero.

      - name: rural_male
        description: >
          Rural male population. Stored as BIGINT, with the source symbol "-"
          interpreted as zero.

      - name: rural_female
        description: >
          Rural female population. Stored as BIGINT, with the source symbol
          "-" interpreted as zero.

      - name: rural_transgender
        description: >
          Rural transgender population. Stored as BIGINT, with the source
          symbol "-" interpreted as zero.

      - name: urban_all_sexes
        description: >
          Urban population for all sexes. Stored as BIGINT, with the source
          symbol "-" interpreted as zero.

      - name: urban_male
        description: >
          Urban male population. Stored as BIGINT, with the source symbol "-"
          interpreted as zero.

      - name: urban_female
        description: >
          Urban female population. Stored as BIGINT, with the source symbol
          "-" interpreted as zero.

      - name: urban_transgender
        description: >
          Urban transgender population. Stored as BIGINT, with the source
          symbol "-" interpreted as zero.